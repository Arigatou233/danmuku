<script>
'use strict';const $=s=>document.querySelector(s);const banner='assets/banner.png';const shows=[{id:1,title:'更衣人偶坠入爱河 第二季',year:2025,season:'夏季',episodes:12,source:'B站',updated:2,comments:'3.2万',pos:'72% 48%'},{id:2,title:'葬送的芙莉莲',year:2023,season:'秋季',episodes:28,source:'动画疯',updated:5,comments:'8.6万',pos:'77% 43%'},{id:3,title:'我推的孩子',year:2023,season:'春季',episodes:11,source:'B站',updated:6,comments:'5.4万',pos:'62% 50%'},{id:4,title:'莉可丽丝',year:2022,season:'夏季',episodes:13,source:'动画疯',updated:8,comments:'4.1万',pos:'88% 45%'}];let ascending=false;const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function img(s){return `<img src="${banner}" alt="${escapeHTML(s.title)}示意封面" style="object-position:${s.pos}" loading="lazy">`}function render(){const q=$('#filterQuery').value.trim().toLowerCase(),year=$('#year').value,season=$('#season').value,source=$('#source').value;let list=shows.filter(s=>(!q||s.title.toLowerCase().includes(q))&&(!year||s.year==year)&&(!season||s.season===season)&&(!source||s.source===source));list.sort((a,b)=>ascending?b.updated-a.updated:a.updated-b.updated);$('#cards').innerHTML=list.length?list.map(s=>`<article class="anime-card" tabindex="0" role="button" data-id="${s.id}" aria-label="查看${escapeHTML(s.title)}"><div class="cover">${img(s)}<span class="pill">${s.episodes} 集</span></div><strong>${escapeHTML(s.title)}</strong><div class="meta"><span><span class="tag">${s.year}年</span><span class="tag">${s.season}</span></span><span>☏ ${s.comments}</span></div></article>`).join(''):'<div class="empty">没有符合条件的番剧</div>';$('#statAnime').textContent=shows.length}function updates(){const list=[...shows].sort((a,b)=>a.updated-b.updated);$('#updateStrip').innerHTML=list.map(s=>`<div class="update">${img(s)}<div><span class="pill">第${s.episodes}集</span><strong>${escapeHTML(s.title)}</strong><small>更新于 ${s.updated} 小时前</small></div></div>`).join('')}function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#dialog').showModal()}function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',2700)}function navigate(id){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.nav===id));if(id==='search'){$('#heroQuery').focus();scrollTo({top:0,behavior:'smooth'})}else if(id==='home')scrollTo({top:0,behavior:'smooth'});else document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'center'})}document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();navigate(b.dataset.nav)}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.action==='compare')modal('版本对比','<p>版本对比界面已预留。接入不同平台的合法弹幕数据后，可实现时间轴校准和差异浏览。</p>');else navigate(b.dataset.action)}));$('#mainSearch').addEventListener('submit',e=>{e.preventDefault();$('#filterQuery').value=$('#heroQuery').value;render();navigate('list')});['filterQuery','year','season','source'].forEach(id=>$('#'+id).addEventListener(id==='filterQuery'?'input':'change',render));$('#sort').addEventListener('click',()=>{ascending=!ascending;$('#sort').textContent=ascending?'更新时间 ↑':'更新时间 ↓';render()});$('#more').addEventListener('click',()=>navigate('list'));$('#cards').addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)detail(+el.dataset.id)});$('#cards').addEventListener('keydown',e=>{if(e.key==='Enter'){const el=e.target.closest('[data-id]');if(el)detail(+el.dataset.id)}});function detail(id){const s=shows.find(x=>x.id===id);modal(s.title,`<img class="detail-cover" src="${banner}" alt="示意封面"><p><b>${s.year}年 · ${s.season} · 共 ${s.episodes} 集</b></p><p>数据来源：${s.source}</p><div class="notice">当前显示的是演示数据和示意封面，并非已采集的真实弹幕。接入数据库后，这里可展示分集弹幕与时间轴。</div>`)}$('#account').addEventListener('click',()=>modal('管理员登录','<p>登录界面已预留。需要接入 Supabase Auth 后才能安全验证管理员身份。</p><label for="email">邮箱</label><input id="email" type="email" placeholder="请输入邮箱" autocomplete="username"><label for="password">密码</label><input id="password" type="password" placeholder="请输入密码" autocomplete="current-password"><button class="primary" id="login">登录（待接入）</button>'));$('#modalBody').addEventListener('click',e=>{if(e.target.id==='login')toast('尚未连接身份验证服务')});$('#notification').addEventListener('click',()=>modal('通知','<p>暂无通知。连接后端后可显示采集任务与同步消息。</p>'));$('#refresh').addEventListener('click',()=>toast('尚未配置采集服务，无法刷新真实状态'));$('#modalClose').addEventListener('click',()=>$('#dialog').close());$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});[...new Set(shows.map(s=>s.year))].sort((a,b)=>b-a).forEach(y=>$('#year').add(new Option(y+'年',y)));updates();render();
</script></body></html>
